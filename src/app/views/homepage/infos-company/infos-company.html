<div>
    <h1 class="md:text-3xl font-bold mb-5">{{experience().company}}</h1>

    <article class="overflow-hidden rounded-lg shadow-sm transition hover:shadow-lg">
        <!-- flex-col sur mobile, flex-row centré verticalement sur desktop -->
        <div class="flex flex-col md:flex-row items-center p-4">

            <!-- Logo centré -->
            <img [ngSrc]="experience().logo" [alt]="experience().company + ' logo'" width="160" height="160"
                class="object-contain rounded-md shrink-0" />

            <div class="bg-white p-4 sm:p-6 flex-1">
                <time datetime="2022-10-10" class="block text-xs text-gray-500">{{ experience().period }}</time>

                <a href="#">
                    <h3 class="mt-0.5 text-lg font-semibold text-gray-900">
                        {{ experience().role }}
                    </h3>
                </a>

                <p class="mt-2 text-sm/relaxed text-gray-600 w-card whitespace-pre-line">
                    {{ experience().description }}
                </p>
            </div>
        </div>
    </article>

</div>
