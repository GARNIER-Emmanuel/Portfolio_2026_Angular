<div class="min-h-[180px] sm:min-h-[160px]">
    <h1 class="md:text-3xl font-bold mb-5">{{formation().name}}</h1>
    <div class="flex flex-col sm:flex-row lg:flex-row-reverse items-start gap-6">
        <img [ngSrc]="formation().logo" width="160" height="160" [alt]="formation().name + ' logo'"
            class="w-36 h-36 shrink-0 object-contain  shadow-2xl rounded-lg" />

        <div>
            <time class="block text-xs text-gray-500">{{ formation().period }}</time>
            <h3 class="font-medium text-gray-900 sm:text-lg">{{formation().title}}</h3>

            <p class="mt-2 text-sm/relaxed text-gray-600 w-card whitespace-pre-line">
                {{formation().description}}
            </p>
        </div>
    </div>
</div>
