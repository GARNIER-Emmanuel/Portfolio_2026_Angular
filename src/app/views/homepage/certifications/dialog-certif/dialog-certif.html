<h2 class="!text-primary-20" mat-dialog-title>{{certification.name}} -
    <span class="font-normal !text-primary-40">{{ certification.site }}</span>
</h2>

<mat-dialog-content class="flex flex-col items-center gap-4 !p-4">
    <!-- Image en grand format avec ratio préservé -->
    <div class="rounded-lg shadow-lg mb-5">
        <img [ngSrc]="certification.image" width="1684" height="1191" priority [alt]="certification.name"
            class="w-full h-auto object-contain bg-black/5" />
    </div>
    @if (certification.description) {
    <p class="text-sm !text-secondary whitespace-pre-line text-center">
        {{ certification.description }} <span i18n="@@certif_dialog_in">en</span> {{certification.obtained_date}} <span i18n="@@certif_dialog_on">sur</span> {{certification.site}}
    </p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end" class="gap-2">
    @if (certification.pdf) {
    <a [href]="certification.pdf" target="_blank" rel="noopener noreferrer" matButton i18n="@@certif_dialog_btn_original">
        Voir l'original ↗
    </a>
    }
    <button matButton mat-dialog-close i18n="@@certif_dialog_btn_close">Fermer</button>
</mat-dialog-actions>
