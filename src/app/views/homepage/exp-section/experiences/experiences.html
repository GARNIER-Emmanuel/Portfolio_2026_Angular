<ol
    class="relative space-y-8 before:absolute before:-ms-px before:h-full before:w-0.5 before:rounded-full before:bg-gray-200">
    @for (exp of experiences(); track exp.id) {
    <li (click)="selectExperience(exp)" (keydown.enter)="selectExperience(exp)" role="button" tabindex="0"
        [class.focus-visible:ring-blue-500]="exp.id === selectedExperienceId()"
        [class.focus-visible:ring-red-500]="exp.id !== selectedExperienceId()"
        class="relative flex items-start gap-4 cursor-pointer transition-all duration-200 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 rounded-lg p-4">
        <span class="size-3 shrink-0 rounded-full -ms-5.5" [class.bg-red-800]="exp.id !== selectedExperienceId()"
            [class.bg-blue-600]="exp.id === selectedExperienceId()"></span>
        <div class="-mt-3 flex-1">
            <time class="text-xs/none font-medium text-gray-700">{{ exp.period }}</time>
            <h3 class="text-lg font-bold text-gray-900">{{ exp.title }}</h3>
            <p class="text-sm font-medium text-gray-600">{{ exp.name }}</p>
            <p class="whitespace-pre-line text-sm text-gray-700 leading-relaxed">
                {{ exp.resume }}
            </p>
        </div>
    </li>
    }
</ol>
