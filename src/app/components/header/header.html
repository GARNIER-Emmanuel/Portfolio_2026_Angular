<header class="bg-black backdrop-blur-md text-[#f3ece3]">

    <div class="mx-auto flex h-16 max-w-7xl items-center gap-8 px-4 sm:px-6 lg:px-8">


        <div class="flex flex-1 items-center justify-end md:justify-between">
            <nav aria-label="Global" class="hidden md:block">
                <ul class="flex items-center gap-6 text-sm">
                    <li>
                        <a class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                            href="#">
                            À propos de moi
                        </a>
                    </li>

                    <li>
                        <a class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                            href="#experiences">
                            Expériences
                        </a>
                    </li>

                    <li>
                        <a class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                            href="#formations">
                            Formations
                        </a>
                    </li>

                    <li>
                        <a class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                            href="#certifications">
                            Certifications
                        </a>
                    </li>

                    <li>
                        <a class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                            href="#projects">
                            Mes projets
                        </a>
                    </li>

                    <li>
                        <a class="text-gray-500 transition hover:text-gray-500/75 dark:text-white dark:hover:text-white/75"
                            href="#centers">
                            Centres d’intérêt
                        </a>
                    </li>

                </ul>
            </nav>

            <div class="flex items-center gap-4">
                <div class="sm:flex sm:gap-4">
                    <a class="hidden rounded-md bg-gray-100 px-5 py-2.5 text-sm font-medium text-teal-600 transition hover:text-teal-600/75 sm:block dark:bg-gray-800 dark:text-white dark:hover:text-white/75"
                        href="#contact">
                        Me contacter
                    </a>
                </div>

                <button [matMenuTriggerFor]="mobileMenu"
                    class="block rounded-sm bg-gray-100 p-2.5 text-gray-600 transition hover:text-gray-600/75 md:hidden dark:bg-gray-800 dark:text-white dark:hover:text-white/75"
                    aria-label="Menu mobile">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-5" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <mat-menu #mobileMenu="matMenu">
                    <a mat-menu-item href="#">À propos de moi</a>
                    <a mat-menu-item href="#experiences">Expériences</a>
                    <a mat-menu-item href="#formations">Formations</a>
                    <a mat-menu-item href="#certifications">Certifications</a>
                    <a mat-menu-item href="#projects">Mes projets</a>
                    <a mat-menu-item href="#centers">Centres d’intérêt</a>
                </mat-menu>

            </div>
        </div>
    </div>
</header>
