<header class="bg-transparent md:bg-primary-10 md:backdrop-blur-md text-primary-80">
    <div class="mx-auto flex h-16 max-w-7xl items-center gap-8 px-4 sm:px-6 lg:px-8 justify-end md:justify-between">

        <!-- Navigation Desktop (à partir de lg / 1024px) -->
        <nav aria-label="Global" class="hidden lg:block">
            <ul class="flex items-center gap-3 xl:gap-6 text-xs xl:text-sm whitespace-nowrap">
                <li><a class="text-primary-80 transition hover:text-white/90" href="#" i18n="@@nav_about">À propos de
                        moi</a></li>
                <li><a class="text-primary-80 transition hover:text-white/90" href="#experiences"
                        i18n="@@nav_experiences">Expériences</a></li>
                <li><a class="text-primary-80 transition hover:text-white/90" href="#formations"
                        i18n="@@nav_formations">Formations</a></li>
                <li><a class="text-primary-80 transition hover:text-white/90" href="#certifications"
                        i18n="@@nav_certifications">Certifications</a></li>
                <li><a class="text-primary-80 transition hover:text-white/90" href="#projects" i18n="@@nav_projects">Mes
                        projets</a></li>
                <li><a class="text-primary-80 transition hover:text-white/90" href="#centers"
                        i18n="@@nav_interests">Centres d’intérêt</a></li>
            </ul>
        </nav>

        <!-- Actions Desktop (CV, Contact, Langue) -->
        <div class="flex items-center gap-2 xl:gap-4">
            <div class="hidden lg:block">
                <a class="whitespace-nowrap rounded-md px-3.5 py-2 xl:px-5 xl:py-2.5 text-xs xl:text-sm font-medium transition duration-400 bg-primary-80 text-primary-20 hover:bg-primary-30 hover:text-white/90 inline-block"
                    href="Emmanuel_GARNIER_BOIDUN_CV.pdf" i18n="@@nav_cv">Voir mon CV</a>
            </div>
            <div class="hidden lg:block">
                <a class="whitespace-nowrap rounded-md px-3.5 py-2 xl:px-5 xl:py-2.5 text-xs xl:text-sm font-medium transition duration-400 bg-primary-80 text-primary-20 hover:bg-primary-30 hover:text-white/90 inline-block"
                    href="#contact" i18n="@@nav_contact">Me contacter</a>
            </div>
            <div class="hidden lg:block">
                <a #langTrigger="matMenuTrigger" [matMenuTriggerFor]="menuFr"
                    class="whitespace-nowrap rounded-md px-3 py-2 xl:px-4 xl:py-2.5 text-xs xl:text-sm font-medium tracking-wide transition duration-400 hover:bg-primary-30 hover:text-white/90 cursor-pointer inline-block"
                    [class.bg-primary-80]="!langTrigger.menuOpen" [class.text-primary-20]="!langTrigger.menuOpen"
                    [class.bg-primary-30]="langTrigger.menuOpen" [class.text-white]="langTrigger.menuOpen">
                    🌐 {{ currentLocale.startsWith('en') ? 'EN' : 'FR' }}
                </a>
            </div>

            <!-- Menu Langue -->
            <mat-menu #menuFr="matMenu">
                <button mat-menu-item (click)="setLanguage('fr')">
                    <span>Français</span>
                </button>
                <button mat-menu-item (click)="setLanguage('en-US')">
                    <span>English</span>
                </button>
            </mat-menu>

            <!-- Bouton burger flottant Mobile (< lg) -->
            <button [matMenuTriggerFor]="mobileMenu"
                class="pointer-events-auto block rounded-full bg-black/85 backdrop-blur-md border border-white/20 p-3 text-white shadow-xl lg:hidden hover:bg-black transition transform active:scale-95"
                aria-label="Menu mobile">
                <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" class="size-6" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <mat-menu #mobileMenu="matMenu">
                <a mat-menu-item href="#" i18n="@@nav_about">À propos de moi</a>
                <a mat-menu-item href="#experiences" i18n="@@nav_experiences">Expériences</a>
                <a mat-menu-item href="#formations" i18n="@@nav_formations">Formations</a>
                <a mat-menu-item href="#certifications" i18n="@@nav_certifications">Certifications</a>
                <a mat-menu-item href="#projects" i18n="@@nav_projects">Mes projets</a>
                <a mat-menu-item href="#centers" i18n="@@nav_interests">Centres d’intérêt</a>
                <a mat-menu-item href="Emmanuel_GARNIER_BOIDUN_CV.pdf" i18n="@@nav_cv">Voir mon CV</a>
                <a mat-menu-item href="#contact" class="font-semibold text-teal-600" i18n="@@nav_contact">Me
                    contacter</a>
                <mat-divider></mat-divider>
                <button mat-menu-item [matMenuTriggerFor]="menuFr">
                    <span>🌐 Langue ({{ currentLocale.startsWith('en') ? 'EN' : 'FR' }})</span>
                </button>
            </mat-menu>
        </div>
    </div>
</header>
