@for (skill of skills(); track skill.name) {
<div class="inline-flex items-center justify-center text-3xl transition-transform duration-200 hover:scale-115"
    [matTooltip]="getTooltip(skill)" [attr.aria-label]="skill.name">

    @if (skill.icon?.startsWith('devicon-')) {
    <i [class]="skill.icon"></i>
    } @else {
    <mat-icon class="!text-3xl !size-8 flex items-center justify-center leading-none">
        {{ skill.icon }}
    </mat-icon>
    }
</div>
}
